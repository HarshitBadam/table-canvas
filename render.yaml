services:
  - type: web
    name: table-canvas-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false
      - key: TRUST_PROXY
        value: "1"
      - key: COOKIE_SAME_SITE
        value: none
      - key: ENABLE_REGISTRATION
        value: "false"
      - key: GOOGLE_CLIENT_ID
        sync: false
